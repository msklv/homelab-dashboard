name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build + tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Build (release)
        run: swift build -c release
      - name: Tests (Check, self-contained)
        run: swift run Check
      - name: Assemble .app bundle
        run: |
          APP=homelab-dashboard.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp .build/release/Dashboard "$APP/Contents/MacOS/homelab-dashboard"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDisplayName</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundleIconFile</key>
          	<string>AppIcon</string>
          	<key>CFBundleExecutable</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.msklv.homelab-dashboard</string>
          	<key>CFBundleName</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>0.1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSApplicationCategoryType</key>
          	<string>public.app-category.utilities</string>
          	<key>LSMinimumSystemVersion</key>
          	<string>13.0</string>
          	<key>NSHighResolutionCapable</key>
          	<true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-dashboard
          path: homelab-dashboard.app
          if-no-files-found: error
          compression-level: 9
