name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Build + publish Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Assemble .app bundle
        run: |
          APP=homelab-dashboard.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp .build/release/Dashboard "$APP/Contents/MacOS/homelab-dashboard"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDisplayName</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundleIconFile</key>
          	<string>AppIcon</string>
          	<key>CFBundleExecutable</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.msklv.homelab-dashboard</string>
          	<key>CFBundleName</key>
          	<string>homelab-dashboard</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>0.2.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSApplicationCategoryType</key>
          	<string>public.app-category.utilities</string>
          	<key>LSMinimumSystemVersion</key>
          	<string>13.0</string>
          	<key>NSHighResolutionCapable</key>
          	<true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
      - name: Package zip
        run: ditto -c -k --keepParent homelab-dashboard.app homelab-dashboard-${{ github.ref_name }}.zip
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: homelab-dashboard-${{ github.ref_name }}.zip
          generate_release_notes: true
